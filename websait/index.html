<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Nutrition Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .result.good {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .result.bad {
            background: #fff3cd;
            border: 2px solid #ffc107;
        }

        .result.worst {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .result h3 {
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .result.good h3 {
            color: #28a745;
        }

        .result.bad h3 {
            color: #ffc107;
        }

        .result.worst h3 {
            color: #dc3545;
        }

        .nutrition-facts {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .nutrition-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #dee2e6;
        }

        .nutrition-item:last-child {
            border-bottom: none;
        }

        .nutrition-item span:first-child {
            font-weight: 600;
            color: #495057;
        }

        .nutrition-item span:last-child {
            color: #667eea;
            font-weight: 700;
        }

        .food-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .food-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
        }

        .food-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .food-item h4 {
            color: #667eea;
            margin-bottom: 5px;
        }

        .food-item p {
            color: #6c757d;
            font-size: 0.9em;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8em;
            font-weight: 600;
            margin-top: 5px;
        }

        .badge.good {
            background: #28a745;
            color: white;
        }

        .badge.bad {
            background: #ffc107;
            color: white;
        }

        .badge.worst {
            background: #dc3545;
            color: white;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍎 Food Nutrition Analyzer</h1>
            <p>Analyze food nutrition and get instant classification results</p>
        </header>

        <div class="main-content">
            <!-- Input Form -->
            <div class="card">
                <h2>Enter Food Nutrition</h2>
                <form id="nutritionForm" method="POST" action="predict.php">
                    <div class="form-group">
                        <label for="calories">Calories (kcal)</label>
                        <input type="number" id="calories" name="calories" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="proteins">Proteins (g)</label>
                        <input type="number" id="proteins" name="proteins" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="fat">Fat (g)</label>
                        <input type="number" id="fat" name="fat" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="carbohydrate">Carbohydrate (g)</label>
                        <input type="number" id="carbohydrate" name="carbohydrate" step="0.01" required>
                    </div>
                    <button type="submit" class="btn">Analyze Nutrition</button>
                </form>

                <div id="result" class="result"></div>
            </div>

            <!-- Food Database -->
            <div class="card">
                <h2>Food Database</h2>
                <div class="food-list" id="foodList">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Load food database
        fetch('get_foods.php')
            .then(response => response.json())
            .then(data => {
                const foodList = document.getElementById('foodList');
                data.forEach(food => {
                    const foodItem = document.createElement('div');
                    foodItem.className = 'food-item';
                    foodItem.onclick = () => fillForm(food);
                    
                    const category = getCategoryClass(food.label);
                    
                    foodItem.innerHTML = `
                        <h4>${food.name || 'Food Item'}</h4>
                        <p>Cal: ${food.calories} | P: ${food.proteins}g | F: ${food.fat}g | C: ${food.carbohydrate}g</p>
                        <span class="badge ${category}">${getCategoryName(food.label)}</span>
                    `;
                    foodList.appendChild(foodItem);
                });
            });

        function fillForm(food) {
            document.getElementById('calories').value = food.calories;
            document.getElementById('proteins').value = food.proteins;
            document.getElementById('fat').value = food.fat;
            document.getElementById('carbohydrate').value = food.carbohydrate;
        }

        function getCategoryClass(label) {
            // Map label names to CSS classes
            if (typeof label === 'string') {
                if (label === 'Sangat Baik') return 'good';
                if (label === 'Baik') return 'good';
                if (label === 'Buruk') return 'bad';
                if (label === 'Sangat Buruk') return 'worst';
            }
            return 'bad';
        }

        function getCategoryName(label) {
            if (typeof label === 'string') return label;
            return 'Unknown';
        }

        // Handle form submission
        document.getElementById('nutritionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const response = await fetch('predict.php', {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            const resultDiv = document.getElementById('result');
            
            resultDiv.style.display = 'block';
            resultDiv.className = 'result ' + result.category;
            
            resultDiv.innerHTML = `
                <h3>${result.title}</h3>
                <p>${result.description}</p>
                <div class="nutrition-facts">
                    <h4>Nutrition Facts</h4>
                    <div class="nutrition-item">
                        <span>Calories</span>
                        <span>${result.nutrition.calories} kcal</span>
                    </div>
                    <div class="nutrition-item">
                        <span>Proteins</span>
                        <span>${result.nutrition.proteins} g</span>
                    </div>
                    <div class="nutrition-item">
                        <span>Fat</span>
                        <span>${result.nutrition.fat} g</span>
                    </div>
                    <div class="nutrition-item">
                        <span>Carbohydrate</span>
                        <span>${result.nutrition.carbohydrate} g</span>
                    </div>
                    <div class="nutrition-item">
                        <span>Total Macros</span>
                        <span>${result.nutrition.total_macros} g</span>
                    </div>
                    <div class="nutrition-item">
                        <span>Protein Ratio</span>
                        <span>${result.nutrition.protein_ratio}%</span>
                    </div>
                    <div class="nutrition-item">
                        <span>Fat Ratio</span>
                        <span>${result.nutrition.fat_ratio}%</span>
                    </div>
                    <div class="nutrition-item">
                        <span>Carb Ratio</span>
                        <span>${result.nutrition.carb_ratio}%</span>
                    </div>
                    <div class="nutrition-item">
                        <span>Calorie Density</span>
                        <span>${result.nutrition.calorie_density} kcal/g</span>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
